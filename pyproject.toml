[project]
name = "efr-opinf"
authors = [{ name = "Ian Moore", email = "ian.moore@rice.edu" }]
version = "0.1.0"
description = "Explicit-filter-regularized Operator Inference (EFR-OpInf) for reduced-order modeling"
requires-python = ">=3.11"
dependencies = ["opinf==0.6.0", "numpy==2.5.1", "matplotlib==3.11.1", "gmsh==4.15.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/efr_opinf"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "==3.14.6"
fenics-dolfinx = "==0.10.0"
mpich = "==5.0.1"
adios2 = "==2.11.0"
adios4dolfinx = "==0.10.0.post0"
pyvista = "==0.48.4"
scipy = "==1.18.0"
tqdm = "==4.70.0"
pyyaml = "*"
pip = "*"
ipykernel = "*"
notebook = "*"

[tool.pixi.pypi-dependencies]
efr-opinf = { path = ".", editable = true }



[tool.pixi.environments]
default = { solve-group = "default" }

