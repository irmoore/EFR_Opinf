# Reference config showing every option run_cylinder_fom() understands,
# with its default value noted. Nothing here is required except time.T --
# see standard_T20.yaml / efr_T20.yaml for minimal examples.

time:
  T: 20.0             # required -- final simulation time, no default
  dt: 0.0005            # default: 1/2000. May affect stability
  sample_gap: 10          # default: 10. Be a bit careful changing this

######## OPTIONS #########
efr:
  filter_start: 10.0    # required if this block is present, no default
  chi: 0.04                # required if this block is present, no default
  delta: 0.016667            # default: res_min (mesh-dependent refinement
                               # length near the obstacle)

output:
  save_monolithic: true   # default: true -- writes the actual training-data
                            # velocity/pressure snapshots to <stem>.bp
  save_KE: true              # default: true -- kinetic energy time series,
                               # saved to <stem>_KE.npz
  save_liftdrag: false         # default: false -- drag/lift coefficients,
                                 # saved to <stem>_liftdrag.npz
  plot: false                    # default: false -- Paraview readable, expensive. 
